name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          # 22.04 → glibc 2.35 floor for the Linux binaries
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ------------------------------------------------------------------ win
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/idea-rotation.exe"
          mkdir staging -Force | Out-Null
          Copy-Item $bin staging/
          & $bin init --config staging/config.toml
          Copy-Item SKILL.md staging/
          Copy-Item assets/icon.png staging/
          Compress-Archive -Path staging/* -DestinationPath Idea-Rotation-${{ matrix.label }}.zip
          Get-Item Idea-Rotation-*.zip

      # ------------------------------------------------------------------- mac
      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
            VERSION="$(grep ^version Cargo.toml | head -1 | cut -d'"' -f2)"
          fi
          APP="Idea Rotation.app"
          BIN="target/${{ matrix.target }}/release/idea-rotation"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" staging

          cp "$BIN" "$APP/Contents/MacOS/idea-rotation"

          # 256px embedded png → iconset → icns (sips + iconutil are stock on macOS)
          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            s2=$((s * 2))
            sips -z $s2 $s2 assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>Idea Rotation</string>
            <key>CFBundleDisplayName</key>       <string>Idea Rotation</string>
            <key>CFBundleExecutable</key>        <string>idea-rotation</string>
            <key>CFBundleIdentifier</key>        <string>io.github.cyrixjd115.idea-rotation</string>
            <key>CFBundleVersion</key>           <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleIconFile</key>          <string>icon</string>
            <key>LSMinimumSystemVersion</key>    <string>11.0</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>CFBundleDevelopmentRegion</key> <string>en</string>
          </dict>
          </plist>
          PLIST

          "$BIN" init --config staging/config.toml
          cp SKILL.md staging/
          cp -R "$APP" staging/
          ditto -c -k --keepParent staging Idea-Rotation-${{ matrix.label }}.zip
          ls -la Idea-Rotation-*.zip

      # ----------------------------------------------------------------- linux
      - name: Package (linux tar.gz)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/idea-rotation"
          mkdir -p dist/Idea-Rotation
          cp "$BIN" dist/Idea-Rotation/
          "$BIN" init --config dist/Idea-Rotation/config.toml
          cp SKILL.md assets/icon.png dist/Idea-Rotation/
          tar -czf Idea-Rotation-linux-x86_64.tar.gz -C dist Idea-Rotation

      - name: Package (linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/idea-rotation"
          mkdir -p AppDir/usr/bin
          cp "$BIN" AppDir/usr/bin/idea-rotation
          cp assets/icon.png AppDir/idea-rotation.png
          cat > AppDir/idea-rotation.desktop <<DESK
          [Desktop Entry]
          Type=Application
          Name=Idea Rotation
          Comment=Config-driven idea & name generator
          Exec=idea-rotation
          Icon=idea-rotation
          Categories=Utility;Development;
          Terminal=false
          DESK
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          OUTPUT=Idea-Rotation-linux-x86_64.AppImage ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir --output appimage
          ls -la Idea-Rotation-*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: |
            Idea-Rotation-*.zip
            Idea-Rotation-*.tar.gz
            Idea-Rotation-*.AppImage
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sanity-check assets
        run: ls -la dist/ && test "$(ls dist | wc -l)" -eq 5

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            One binary, three faces — **GUI** (just run it), **CLI**
            (`idea-rotation generate --pattern "Of The"`), **MCP server**
            (`idea-rotation mcp`, stdio JSON-RPC for AI agents).

            | Asset | OS |
            |---|---|
            | `Idea-Rotation-windows-x64.zip` | Windows x64 (`.exe`) |
            | `Idea-Rotation-linux-x86_64.tar.gz` | Linux x86-64 (tarball) |
            | `Idea-Rotation-linux-x86_64.AppImage` | Linux x86-64 (AppImage) |
            | `Idea-Rotation-macos-arm64.zip` | macOS Apple Silicon (`.app`) |
            | `Idea-Rotation-macos-x64.zip` | macOS Intel (`.app`) |

            Every archive ships with `config.toml` + `SKILL.md`.
            Setup steps for agents and humans: [`install.md`](https://github.com/CyrixJD115/Idea-Rotation/blob/main/install.md)
